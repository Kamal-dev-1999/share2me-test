<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShareIt POC - Sender</title>
    <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}</style>
  </head>
  <body>
    <h2>ShareIt POC — Sender</h2>
    <label>Choose file: <input id="file" type="file" /></label>
    <div>
      <button id="create">Create OTC & Prepare (with E2EE)</button>
      <span id="otc"></span>
    </div>
    <div>
      <button id="start-rtc">Start WebRTC Send</button>
    </div>
    <div id="status"></div>

    <div id="qrcode"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script>
      const socket = io();
      const fileInput = document.getElementById('file');
      const createBtn = document.getElementById('create');
      const otcSpan = document.getElementById('otc');
      const status = document.getElementById('status');
      const startRtcBtn = document.getElementById('start-rtc');
      const qrcodeDiv = document.getElementById('qrcode');

      let currentOTC = null;
      let pc = null;
      let dc = null;

      function setStatus(s){ status.textContent = s }

      createBtn.addEventListener('click', () => {
        if (!fileInput.files.length) return alert('Pick a file first');
        socket.emit('create_room', (res) => {
          currentOTC = res.otc;
          otcSpan.textContent = 'OTC: ' + currentOTC;
          const file = fileInput.files[0];
          qrcodeDiv.innerHTML = '';
          setStatus('Preparing encrypted metadata...');
          // use worker to compute key/hash and chunks
          file.arrayBuffer().then(buffer => {
            window._worker = new Worker('worker.js');
            _worker.postMessage({ type: 'encrypt', fileName: file.name, fileBuffer: buffer, chunkSize: file.size >= 5*1024*1024 ? 64*1024 : 1024 });
            _worker.addEventListener('message', (ev) => {
              const m = ev.data;
              if (m.type === 'metadata') {
                const meta = m.metadata;
                // show metadata JSON for receiver (copy/paste) and QR
                const metaStr = JSON.stringify(meta);
                const ta = document.createElement('textarea');
                ta.rows = 6; ta.cols = 60; ta.value = metaStr;
                qrcodeDiv.appendChild(ta);
                QRCode.toCanvas(metaStr, { width: 256 }, (err, canvas) => { if (!err) qrcodeDiv.appendChild(canvas); });
                otcSpan.textContent = 'OTC: ' + currentOTC;
                setStatus('Room created — metadata ready. Share QR or metadata JSON.');
              } else if (m.type === 'chunk') {
                // buffer encrypted chunks until DataChannel open
                if (!window._pendingChunks) window._pendingChunks = [];
                window._pendingChunks.push(m);
                if (dc && dc.readyState === 'open') {
                  sendPendingChunks();
                }
              } else if (m.type === 'done') {
                console.log('worker done producing chunks');
              }
            });
          });
        });
        });
      });

      startRtcBtn.addEventListener('click', async () => {
        if (!currentOTC) return alert('Create a room first');
        const file = fileInput.files[0];
        if (!file) return alert('Pick a file');
        setStatus('Preparing WebRTC...');
        pc = new RTCPeerConnection();
        dc = pc.createDataChannel('file');
        dc.binaryType = 'arraybuffer';

        dc.onopen = () => {
          setStatus('DataChannel open, streaming encrypted file');
          sendPendingChunks();
        };

        dc.onclose = () => setStatus('DataChannel closed');

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            socket.emit('signal', { otc: currentOTC, type: 'ice', data: e.candidate });
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('signal', { otc: currentOTC, type: 'offer', data: offer });

        socket.on('signal', async (msg) => {
          if (!msg || msg.otc !== currentOTC) return;
          if (msg.type === 'answer') {
            await pc.setRemoteDescription(msg.data);
            setStatus('Received answer');
          } else if (msg.type === 'ice') {
            try { await pc.addIceCandidate(msg.data); } catch(e){}
          }
        });
      });

      function sendPendingChunks() {
        if (!window._pendingChunks || !window._pendingChunks.length) return;
        while (window._pendingChunks.length) {
          const ch = window._pendingChunks.shift();
          // send as JSON with base64 data and iv
          dc.send(JSON.stringify({ seq: ch.seq, total: ch.total, data: ch.data, iv: ch.iv }));
          setStatus(`Sent chunk ${ch.seq+1}/${ch.total}`);
        }
        // signal done
        dc.send(JSON.stringify({ done: true }));
      }

      function arrayBufferToBase64(buffer){
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }
    </script>
  </body>
</html>
