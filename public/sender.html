<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShareIt POC - Sender</title>
    <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}</style>
  </head>
  <body>
    <h2>ShareIt POC — Sender</h2>
    <label>Choose file: <input id="file" type="file" /></label>
    <div>
      <button id="create">Create OTC & Prepare (with E2EE)</button>
      <span id="otc"></span>
    </div>
    <div>
      <button id="start-rtc">Start WebRTC Send</button>
    </div>
    <div id="status"></div>

    <div id="qrcode"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="/storage.js"></script>
    <script>
      const socket = io();
      window.socket = socket;
      const fileInput = document.getElementById('file');
      const createBtn = document.getElementById('create');
      const otcSpan = document.getElementById('otc');
      const status = document.getElementById('status');
      const startRtcBtn = document.getElementById('start-rtc');
      const qrcodeDiv = document.getElementById('qrcode');

      let currentOTC = null;
      let currentTransferId = null;
      let pc = null;
      let dc = null;
      let pendingSendSeqs = new Set();

      function setStatus(s){ status.textContent = s }

      createBtn.addEventListener('click', () => {
        if (!fileInput.files.length) return alert('Pick a file first');
        socket.emit('create_room', (res) => {
          currentOTC = res.otc;
          currentTransferId = currentOTC;
          otcSpan.textContent = 'OTC: ' + currentOTC;
          const file = fileInput.files[0];
          qrcodeDiv.innerHTML = '';
          setStatus('Preparing encrypted metadata...');
          // use worker to compute key/hash and chunks
          file.arrayBuffer().then(buffer => {
            window._worker = new Worker('worker.js');
            _worker.addEventListener('message', (ev) => {
              const m = ev.data;
              if (m.type === 'metadata') {
                const meta = m.metadata;
                currentTransferId = currentOTC;
                // show metadata JSON for receiver (copy/paste) and QR
                const metaStr = JSON.stringify(meta);
                const ta = document.createElement('textarea');
                ta.rows = 6; ta.cols = 60; ta.value = metaStr;
                qrcodeDiv.appendChild(ta);
                QRCode.toCanvas(metaStr, { width: 256 }, (err, canvas) => { if (!err) qrcodeDiv.appendChild(canvas); });
                otcSpan.textContent = 'OTC: ' + currentOTC;
                setStatus('Room created — metadata ready. Share QR or metadata JSON.');
                } else if (m.type === 'chunk') {
                  // persist chunk to IndexedDB and buffer
                  const transferId = currentTransferId;
                  // store encrypted data (base64) and iv
                  ShareItStorage.saveChunk(transferId, 'sender', m.seq, m.data, m.iv).catch(console.error);
                  pendingSendSeqs.add(m.seq);
                  if (dc && dc.readyState === 'open') {
                    sendPendingChunks();
                  }
              } else if (m.type === 'done') {
                console.log('worker done producing chunks');
              }
            });
            // post after listener attached to avoid race
            _worker.postMessage({ type: 'encrypt', fileName: file.name, fileBuffer: buffer, chunkSize: file.size >= 5*1024*1024 ? 64*1024 : 1024 });
          });
        });
      });

      startRtcBtn.addEventListener('click', async () => {
        if (!currentOTC) return alert('Create a room first');
        const file = fileInput.files[0];
        if (!file) return alert('Pick a file');
        setStatus('Preparing WebRTC...');
        pc = new RTCPeerConnection();
        dc = pc.createDataChannel('file');
        dc.binaryType = 'arraybuffer';

        dc.onopen = () => {
          setStatus('DataChannel open, streaming encrypted file');
          sendPendingChunks();
        };

        dc.onclose = () => setStatus('DataChannel closed');

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            socket.emit('signal', { otc: currentOTC, type: 'ice', data: e.candidate });
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('signal', { otc: currentOTC, type: 'offer', data: offer });

        socket.on('signal', async (msg) => {
          if (!msg || msg.otc !== currentOTC) return;
          if (msg.type === 'answer') {
            await pc.setRemoteDescription(msg.data);
            setStatus('Received answer');
          } else if (msg.type === 'ice') {
            try { await pc.addIceCandidate(msg.data); } catch(e){}
          }
        });

        socket.on('nack', async (msg) => {
          if (!msg || msg.otc !== currentOTC) return;
          const missingSeqs = Array.isArray(msg.missingSeqs) ? msg.missingSeqs : [];
          if (!missingSeqs.length) return;
          await resendMissingChunks(missingSeqs);
        });
      });

      async function sendPendingChunks() {
        // prefer reading from persistent storage for resume support
        const transferId = currentTransferId || currentOTC;
        const chunks = await ShareItStorage.getChunks(transferId, 'sender').catch(() => []);
        if (!chunks || !chunks.length) return;
        for (const ch of chunks.sort((a,b)=>a.seq-b.seq)){
          dc.send(JSON.stringify({ seq: ch.seq, total: ch.total || chunks.length, data: chunkDataToBase64(ch.data), iv: chunkDataToBase64(ch.iv) }));
          setStatus(`Sent chunk ${ch.seq+1}/${ch.total || chunks.length}`);
        }
        dc.send(JSON.stringify({ done: true, transferId }));
      }

      async function resendMissingChunks(missingSeqs) {
        if (!dc || dc.readyState !== 'open') return;
        const transferId = currentTransferId || currentOTC;
        const uniqueMissing = [...new Set(missingSeqs)].sort((a, b) => a - b);
        for (const seq of uniqueMissing) {
          const chunk = await ShareItStorage.getChunk(transferId, 'sender', seq).catch(() => null);
          if (!chunk) continue;
          dc.send(JSON.stringify({ seq: chunk.seq, total: uniqueMissing.length, data: chunkDataToBase64(chunk.data), iv: chunkDataToBase64(chunk.iv), resend: true }));
          setStatus(`Resent missing chunk ${chunk.seq + 1}`);
        }
        dc.send(JSON.stringify({ done: true, transferId, resend: true }));
      }

      function chunkDataToBase64(data) {
        if (!data) return null;
        if (typeof data === 'string') return data;
        if (data instanceof ArrayBuffer) {
          const bytes = new Uint8Array(data);
          let binary = '';
          for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
          return btoa(binary);
        }
        if (ArrayBuffer.isView(data)) {
          const bytes = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
          let binary = '';
          for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
          return btoa(binary);
        }
        return String(data);
      }

      function arrayBufferToBase64(buffer){
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }
    </script>
  </body>
</html>
