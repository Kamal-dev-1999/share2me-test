<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShareIt POC - Receiver</title>
    <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}</style>
  </head>
  <body>
    <h2>ShareIt POC — Receiver</h2>
    <label>Enter OTC: <input id="otc" /></label>
    <button id="join">Join</button>
    <div>
      <p>Paste metadata JSON (from sender QR or copy):</p>
      <textarea id="metadata" rows="6" cols="60"></textarea>
      <button id="import-meta">Import Metadata</button>
    </div>
    <div id="status"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
      // storage.js is loaded from sender page; if not, attempt dynamic import
    </script>
    <script src="/storage.js"></script>
    <script>
      const socket = io();
      window.socket = socket;
      const joinBtn = document.getElementById('join');
      const otcInput = document.getElementById('otc');
      const status = document.getElementById('status');

      let pc = null;
      let fileBuffer = [];
      let receivedSeqs = new Set();
      let expectedTotal = 0;
      let transferMeta = null;
      let nackTimer = null;

      function setStatus(s){ status.textContent = s }

      joinBtn.addEventListener('click', () => {
        const otc = otcInput.value.trim();
        if (!otc) return alert('Enter OTC');
        socket.emit('join_room', { otc }, (res) => {
          if (res && res.error) return setStatus('Join error: ' + res.error);
          setStatus('Joined room, waiting for offer...');
            setupHandlers(otc);
        });
      });

        document.getElementById('import-meta').addEventListener('click', () => {
          const txt = document.getElementById('metadata').value.trim();
          if (!txt) return alert('Paste metadata JSON');
          try {
            const meta = JSON.parse(txt);
            transferMeta = meta;
            window._transferId = meta.otc || otcInput.value.trim();
            window._expectedTotal = meta.total || Math.ceil(meta.s / (meta.c || 1024));
            // import key to worker
            window._worker = new Worker('worker.js');
            _worker.addEventListener('message', (ev) => {
              if (ev.data && ev.data.type === 'keyImported') setStatus('Metadata imported, ready to receive');
              if (ev.data && ev.data.type === 'decrypted') {
                // store decrypted chunk to IndexedDB for persistence
                const transferId = window._transferId || otcInput.value.trim();
                const seq = ev.data.seq;
                const ab = ev.data.data; // ArrayBuffer
                ShareItStorage.saveChunk(transferId, 'receiver', seq, ab).catch(console.error);
                if (!window._received) window._received = [];
                window._received[seq] = new Uint8Array(ab);
                receivedSeqs.add(seq);
                setStatus(`Decrypted chunk ${seq+1}/${window._expectedTotal}`);
                scheduleNackCheck();
              }
            });
            // post after listener attached
            _worker.postMessage({ type: 'importKey', keyB64: meta.key });
          } catch (err) { alert('Invalid JSON'); }
        });

      function setupHandlers(otc){
        pc = new RTCPeerConnection();

        pc.ondatachannel = (e) => {
          const dc = e.channel;
          dc.binaryType = 'arraybuffer';
          dc.onmessage = (ev) => handleMessage(ev.data);
          dc.onopen = () => setStatus('DataChannel open');
        };

        pc.onicecandidate = (e) => {
          if (e.candidate) socket.emit('signal', { otc, type: 'ice', data: e.candidate });
        };

        socket.on('ack', (msg) => {
          if (!msg || msg.otc !== otc) return;
          // receipt of ack from sender isn't required for UI, but can be used later.
        });

        socket.on('signal', async (msg) => {
          if (!msg || msg.otc !== otc) return;
          if (msg.type === 'offer') {
            await pc.setRemoteDescription(msg.data);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('signal', { otc, type: 'answer', data: answer });
            setStatus('Sent answer');
          } else if (msg.type === 'ice') {
            try { await pc.addIceCandidate(msg.data); } catch(e){}
          }
        });
      }

      function handleMessage(raw){
        try{
          const obj = JSON.parse(raw);
          if (obj.done){
            expectedTotal = obj.total || expectedTotal || (transferMeta ? transferMeta.total : 0);
            scheduleNackCheck(true);
            return;
          }
          // forward encrypted data to worker to decrypt
          if (window._worker) {
            window._worker.postMessage({ type: 'decryptChunk', seq: obj.seq, dataB64: obj.data, ivB64: obj.iv });
            expectedTotal = obj.total;
          } else {
            console.warn('No worker/key imported to decrypt chunk');
          }
        }catch(e){console.error(e)}
      }

      function scheduleNackCheck(finalCheck = false){
        if (nackTimer) clearTimeout(nackTimer);
        nackTimer = setTimeout(async () => {
          const total = expectedTotal || (transferMeta ? transferMeta.total : 0);
          if (!total) return;
          const missing = [];
          for (let i = 0; i < total; i++) {
            if (!receivedSeqs.has(i)) missing.push(i);
          }
          if (missing.length) {
            socket.emit('nack', {
              otc: document.getElementById('otc').value.trim(),
              transferId: window._transferId || document.getElementById('otc').value.trim(),
              total,
              missingSeqs: missing
            });
            setStatus(`Requested ${missing.length} missing chunk(s)`);
            return;
          }
          if (finalCheck) {
            await assembleAndDownload();
            setStatus('File received');
          }
        }, 400);
      }

      async function assembleAndDownload(){
        // assemble from persistent storage (prefer) or in-memory
        const transferId = window._transferId || document.getElementById('otc').value.trim();
        const chunks = await ShareItStorage.getChunks(transferId, 'receiver').catch(() => []);
        const parts = [];
        if (chunks && chunks.length) {
          // chunks.data may be ArrayBuffer or base64
          for (const c of chunks.sort((a,b)=>a.seq-b.seq)){
            const d = c.data;
            if (d instanceof ArrayBuffer) parts.push(new Uint8Array(d));
            else if (typeof d === 'string') {
              // base64 -> ArrayBuffer
              const bin = atob(d);
              const arr = new Uint8Array(bin.length);
              for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
              parts.push(arr);
            }
          }
        } else {
          for (let i=0;i<expectedTotal;i++) parts.push(new Uint8Array(window._received[i]));
        }
        const size = parts.reduce((s,p)=>s+p.byteLength,0);
        const tmp = new Uint8Array(size);
        let offset = 0;
        for (const p of parts){ tmp.set(p, offset); offset += p.byteLength }
        const blob = new Blob([tmp]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'received.bin';
        a.click();
      }

      function base64ToArrayBuffer(base64){
        const binary = atob(base64);
        const len = binary.length;
        const bytes = new Uint8Array(len);
        for (let i=0;i<len;i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
      }
    </script>
  </body>
</html>
