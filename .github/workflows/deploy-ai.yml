name: Deploy AI Service to Cloud Run

on:
  push:
    branches: [main, gcp-migration, v3.5]
    paths:
      - 'backend/ml/**'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: share2me-508017
  GCP_REGION: asia-south1
  AR_REPO: share2me-docker
  AI_SERVICE: share2me-ai

permissions:
  contents: read
  id-token: write

jobs:
  deploy-ai:
    name: Build & Deploy Standalone AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push AI Service Image with Cache
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ml
          file: ./backend/ml/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/ai-service:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run (2 vCPU, 8GiB, Scale to Zero)
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/ai-service"
          gcloud run deploy ${{ env.AI_SERVICE }} \
            --image=${IMAGE}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --cpu=2 \
            --memory=8Gi \
            --execution-environment=gen2 \
            --min-instances=0 \
            --max-instances=5 \
            --concurrency=4 \
            --timeout=300s \
            --allow-unauthenticated \
            --startup-cpu-boost \
            --set-env-vars="INTERNAL_ML_SECRET=${{ secrets.INTERNAL_ML_SECRET || 'dc89162ed90f970e58c0f77d214ae497ad396fc0afa580e3210312dcf97305fb' }},OMP_NUM_THREADS=2,ONNXRUNTIME_NUM_THREADS=2" \
            --quiet

      - name: Verify AI Deployment
        run: |
          URL=$(gcloud run services describe ${{ env.AI_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "AI Service deployed to: ${URL}"
          curl -sf --max-time 45 "${URL}/health" > /dev/null
          echo "✅ AI service health check passed"
