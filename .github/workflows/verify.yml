name: Verify

# Non-deploying quality gate. Runs on PRs or manual dispatch (not on push to deploy branches).
on:
  pull_request:
    branches:
      - oracle-cloud
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-typecheck:
    name: TypeScript (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix frontend
      - run: npm run typecheck --prefix frontend

  backend-syntax:
    name: JavaScript syntax (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check on all backend source files
        run: find backend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

  markdown-pdf-tests:
    name: Markdown → PDF engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix backend
      - run: npm run test:md-pdf --prefix backend

  frontend-lint-report:
    name: ESLint backlog (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix frontend
      - run: npm run lint:report --prefix frontend
