name: Deploy Frontend to Cloud Run

on:
  push:
    branches: [v3.5]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: share2me-508017
  GCP_REGION: asia-south1
  AR_REPO: share2me-docker
  FRONTEND_SERVICE: share2me-frontend
  BACKEND_DOMAIN: api.share2.me

permissions:
  contents: read
  id-token: write

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image with Cache
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_SIGNAL_URL=https://${{ env.BACKEND_DOMAIN }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=G-CCBEZ2KK0S
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend"
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${IMAGE}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --quiet

      - name: Verify Deployment
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Frontend deployed to: ${URL}"
          curl -sf --max-time 30 "${URL}/" > /dev/null
          echo "✅ Frontend health check passed"
